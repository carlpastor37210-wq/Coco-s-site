<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drinks Menu | Coco's Café</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/drinks.css">
</head>
<body data-menu-page="drinks">
    <header class="menu-topbar">
        <a href="../index.html" class="menu-topbar__home">&larr; <span data-mi18n="back">Back home</span></a>
        <button type="button" class="menu-topbar__lang" id="menuLangToggle" aria-label="Change language / Keisti kalbą">LT</button>
    </header>

    <main class="menu-page">
        <section class="menu-hero">
            <div class="menu-hero__content">
                <p class="eyebrow" data-mi18n="drinks.eyebrow">Drinks menu</p>
                <h1 data-mi18n="drinks.title">Drinks that feel as warm as the room.</h1>
                <p data-mi18n="drinks.intro">From high-quality and locally sourced ingredients, explore our menu from OG classics to signature drinks and discover something that invites you to stay a little longer.</p>
                <div class="menu-hero__actions">
                    <a href="../index.html#contact" class="btn btn-primary" data-mi18n="visit">Visit the café</a>
                    <a href="../index.html" class="btn btn-secondary" data-mi18n="back">Back home</a>
                </div>
            </div>
            <div class="menu-hero__image">
                <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=900&q=80" alt="A fresh coffee drink served in a café">
            </div>
        </section>

        <nav class="section-nav" id="sectionNav" hidden></nav>
        <div id="menuRoot"></div>
    </main>

    <script src="../js/menu-page.js"></script>
</body>
</html>
