<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | Coco's Café</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/drinks.css">
    <link rel="stylesheet" href="../css/events.css">
</head>
<body class="events-body">
    <header class="menu-topbar">
        <div class="menu-topbar__inner">
            <a href="../index.html" class="menu-topbar__home"><img src="../images/logo-main/logo-nav.webp" width="64" height="64" alt="Coco's Café" class="menu-topbar__logo"><span class="menu-topbar__back" data-ev="back">Back home</span></a>
        <button type="button" class="menu-topbar__lang" id="langToggle" aria-label="Change language / Keisti kalbą">LT</button>
        </div>
    </header>

    <main class="ev-page">
        <div class="ev-intro">
            <h1 data-ev="title">Events</h1>
            <p data-ev="intro">Tastings, art evenings and gatherings at Coco's. Pick a date to see what's on.</p>
        </div>

        <div class="ev-layout">
            <section class="ev-cal" aria-labelledby="calMonth">
                <div class="ev-cal__head">
                    <h2 id="calMonth" aria-live="polite">&nbsp;</h2>
                    <div class="ev-cal__nav">
                        <button type="button" id="prevMonth" class="ev-round" data-ev-aria="prev">&#8249;</button>
                        <button type="button" id="nextMonth" class="ev-round" data-ev-aria="next">&#8250;</button>
                    </div>
                </div>
                <div class="ev-cal__weekdays" id="weekdays"></div>
                <div class="ev-cal__grid" id="calGrid"></div>
            </section>

            <section class="ev-upcoming" aria-labelledby="upcomingTitle">
                <h2 id="upcomingTitle" data-ev="upcoming">Coming up</h2>
                <div id="upcomingList" class="ev-upcoming__list"><p class="ev-muted" data-ev="loading">Loading events…</p></div>
            </section>
        </div>
    </main>

    <dialog class="ev-dialog" id="eventDialog" aria-labelledby="dlgTitle">
        <article class="ev-ticket" id="ticket">
            <div class="ev-ticket__stub" id="ticketStub"></div>
            <div class="ev-ticket__main">
                <button type="button" class="ev-close" id="closeDialog" data-ev-aria="close">&times;</button>
                <div id="ticketBody"></div>
            </div>
        </article>
    </dialog>

    <script src="../js/events.js"></script>
</body>
</html>
