<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events & Gallery | Coco's Café</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background: #f9f7f4; }
        .page-shell { max-width: 900px; margin: 0 auto; padding: 120px 20px 80px; }
        .page-card { background: white; border-radius: 20px; padding: 32px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .page-card h1 { color: #c4848b; margin-bottom: 12px; }
        .page-card p { color: #666; margin-bottom: 20px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        .gallery-item { background: #f9f7f4; border-radius: 14px; padding: 16px; min-height: 120px; color: #666; }
    </style>
</head>
<body>
    <div class="page-shell">
        <div class="page-card">
            <h1>Events & Gallery</h1>
            <p>This placeholder page can later showcase real event photos, community moments, and seasonal happenings.</p>
            <div class="gallery-grid">
                <div class="gallery-item">Coffee tasting evening</div>
                <div class="gallery-item">Local artist session</div>
                <div class="gallery-item">Weekend brunch gathering</div>
                <div class="gallery-item">Holiday special event</div>
            </div>
        </div>
    </div>
</body>
</html>
