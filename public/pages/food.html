<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu | Coco's Café</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/drinks.css">
</head>
<body data-menu-page="food">
    <header class="menu-topbar">
        <a href="../index.html" class="menu-topbar__home">&larr; <span data-mi18n="back">Back home</span></a>
        <button type="button" class="menu-topbar__lang" id="menuLangToggle" aria-label="Change language / Keisti kalbą">LT</button>
    </header>

    <main class="menu-page">
        <section class="menu-hero">
            <div class="menu-hero__content">
                <p class="eyebrow" data-mi18n="food.eyebrow">Food menu</p>
                <h1 data-mi18n="food.title">Food made for leisurely mornings and shared afternoons.</h1>
                <p data-mi18n="food.intro">Pastries, special breakfasts and tasty bites for your moments of rest.</p>
                <div class="menu-hero__actions">
                    <a href="../index.html#contact" class="btn btn-primary" data-mi18n="visit">Visit the café</a>
                    <a href="../index.html" class="btn btn-secondary" data-mi18n="back">Back home</a>
                </div>
            </div>
            <div class="menu-hero__image">
                <img src="https://images.unsplash.com/photo-1485808191679-5f86510681a2?auto=format&fit=crop&w=900&q=80" alt="A beautifully plated café pastry and coffee">
            </div>
        </section>

        <nav class="section-nav" id="sectionNav" hidden></nav>
        <div id="menuRoot"></div>
    </main>

    <script src="../js/menu-page.js"></script>
</body>
</html>
